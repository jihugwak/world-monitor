name: Publish app + feed snapshot

# One GitHub Pages site serves BOTH:
#   - the installable PWA (phone/web build of the renderer), and
#   - feed-snapshot.json, refreshed by the server-side collector.
# GitHub Pages allows a single deployment per site, so both are built and
# published together here. Runs on push (app changes) and on a cron (fresh
# news even when your PC is off).

on:
  push:
    branches: [main]
  schedule:
    # Every 5 minutes — the fastest GitHub Actions cron allows (runs may still
    # be delayed a few minutes under load). This is the real freshness floor;
    # polling the app faster than this just re-reads the same snapshot.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build the installable web/PWA renderer (VITE_TARGET=web gates the
      # Electron-only in-app reader + enables the service worker).
      - name: Build web app
        run: npm run build
        env:
          VITE_TARGET: web

      # Collect all feeds server-side and drop the snapshot next to the app so
      # it's reachable at <pages-url>/feed-snapshot.json.
      - name: Collect feed snapshot
        run: |
          node scripts/collect.mjs
          cp snapshot/feed-snapshot.json dist/feed-snapshot.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
