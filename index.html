<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World Monitor</title>
    <meta name="description" content="실시간 뉴스 · YouTube 라이브 · AI/AGI 피드 모니터" />

    <!-- PWA (phone / installable web build) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="World Monitor" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fm-theme');
          if (t) t = t.replace(/"/g, '');
          if (t === 'light') document.documentElement.dataset.theme = 'light';
          else document.documentElement.dataset.theme = 'dark';
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
